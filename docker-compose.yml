services:
  postgres:
    image: postgres:16
    container_name: todos-postgres-ccnlthd
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: schedule_app
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '5432:5432'
    volumes:
      - todos-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: todos-redis-ccnlthd
    ports:
      - '6379:6379'
    volumes:
      - todos-redisdata:/data

  postgres-test:
    image: postgres:16
    container_name: todos-postgres-test-ccnlthd
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: schedule_app_test 
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '5433:5432' 
    volumes:
      - todos-pgdata-test:/var/lib/postgresql/data

volumes:
  todos-pgdata:
  todos-redisdata:
  todos-pgdata-test:
